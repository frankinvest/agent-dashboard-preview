<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>智造云控 · 企业级配电箱制造管理系统（可交互原型）</title>
<style>
:root{--nav:#0e2746;--nav-hi:#1d4f8a;--primary:#204e8c;--primary-dk:#163a6b;--danger:#dd2527;--bg:#f1f6f9;--card:#fff;--line:#dde5ec;--txt:#1c2b3a;--txt-2:#5b6b7c;--txt-3:#8a97a5;--ok:#1d7a4d;--warn:#b26a00;--r:8px;--r-sm:6px}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt)}
button{font:inherit;cursor:pointer;border:none}
input,select,textarea{font:inherit;color:var(--txt)}
table{width:100%;border-collapse:collapse}
.app{display:flex;min-height:100vh}
.side{width:200px;flex:none;background:var(--nav);color:#c7d4e2;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand b{display:block;color:#fff;font-size:15px;letter-spacing:.5px}
.brand span{display:block;font-size:11px;color:#7d92a8;margin-top:2px}
.nav{padding:8px;flex:1;overflow:auto}
.nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 10px;border-radius:var(--r-sm);background:none;color:#c7d4e2;font-size:13px;margin-bottom:2px}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.on{background:var(--nav-hi);color:#fff;font-weight:500}
.nav .ico{width:16px;text-align:center;opacity:.85;font-size:13px}
.side .ft{padding:10px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#6d8298;line-height:1.5}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:52px;flex:none;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:20}
.top h1{font-size:15px;font-weight:600}
.top .sp{flex:1}
.pill{font-size:11px;padding:2px 8px;border-radius:20px;background:#eef3f8;color:var(--txt-2)}
.pill.demo{background:#fff4e0;color:var(--warn)}
.who{font-size:12px;color:var(--txt-2)}
.who b{color:var(--txt)}
.body{padding:18px 20px 40px;max-width:1440px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.card>h2{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h2 .tag{font-size:11px;font-weight:400;color:var(--txt-3)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g6{grid-template-columns:repeat(6,1fr)}
.g21{grid-template-columns:2fr 1fr}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .k{font-size:12px;color:var(--txt-2)}
.kpi .v{font-size:22px;font-weight:600;margin:4px 0 2px;letter-spacing:-.3px}
.kpi .s{font-size:11px;color:var(--txt-3)}
.kpi.acc .v{color:var(--primary)}
.kpi.dang .v{color:var(--danger)}
.btn{padding:6px 13px;border-radius:var(--r-sm);background:var(--primary);color:#fff;font-size:13px;font-weight:500}
.btn:hover{background:var(--primary-dk)}
.btn.ghost{background:#fff;color:var(--primary);border:1px solid var(--primary)}
.btn.dgr{background:var(--danger)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{background:#c3cdd7;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:12px;color:var(--txt-2);margin-bottom:4px}
.fld label .req{color:var(--danger);margin-left:2px}
.fld input,.fld select,.fld textarea{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;font-size:13px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--primary)}
.fld.bad input,.fld.bad select{border-color:var(--danger);background:#fff8f8}
.fld .hint{font-size:11px;color:var(--txt-3);margin-top:3px}
.fld .err{font-size:11px;color:var(--danger);margin-top:3px}
th{text-align:left;font-size:12px;font-weight:500;color:var(--txt-2);padding:8px 10px;border-bottom:1px solid var(--line);background:#fafcfd;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #eef2f6;font-size:13px;vertical-align:top}
tr:last-child td{border-bottom:none}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.tag-s{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;background:#eef2f6;color:var(--txt-2);white-space:nowrap}
.tag-s.blue{background:#e4edf8;color:var(--primary)}
.tag-s.grn{background:#e6f5ec;color:var(--ok)}
.tag-s.amb{background:#fdf3e0;color:var(--warn)}
.bars{display:flex;align-items:flex-end;gap:10px;height:158px;padding-top:8px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}
.bars .bar{width:100%;max-width:34px;background:var(--nav-hi);border-radius:3px 3px 0 0;min-height:3px}
.bars .bar.alt{background:#7fa3cd}
.bars .lb{font-size:11px;color:var(--txt-3);white-space:nowrap}
.bars .vl{font-size:11px;color:var(--txt-2);font-variant-numeric:tabular-nums}
.hbar{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px}
.hbar .n{width:68px;color:var(--txt-2);flex:none}
.hbar .t{flex:1;height:9px;background:#eef2f6;border-radius:5px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--nav-hi);border-radius:5px}
.hbar .val{width:88px;text-align:right;color:var(--txt-2);font-variant-numeric:tabular-nums}
.steps{display:flex;align-items:center;flex-wrap:wrap;margin:8px 0}
.step{display:flex;align-items:center;gap:6px}
.step .dot{width:20px;height:20px;border-radius:50%;background:#eef2f6;color:var(--txt-3);display:grid;place-items:center;font-size:11px;flex:none}
.step .nm{font-size:12px;color:var(--txt-3)}
.step.done .dot{background:var(--ok);color:#fff}
.step.done .nm{color:var(--txt)}
.step.cur .dot{background:var(--primary);color:#fff;box-shadow:0 0 0 3px #dbe6f5}
.step.cur .nm{color:var(--primary);font-weight:600}
.step-line{width:18px;height:1px;background:#dde5ec;margin:0 5px}
.mask{position:fixed;inset:0;background:rgba(14,39,70,.42);display:grid;place-items:center;z-index:60;padding:20px}
.modal{background:#fff;border-radius:var(--r);width:560px;max-width:100%;max-height:88vh;overflow:auto;box-shadow:0 18px 48px rgba(14,39,70,.24)}
.modal .mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal .mh h3{font-size:14px;font-weight:600;flex:1}
.modal .mb{padding:16px 18px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#fafcfd}
.x{background:none;color:var(--txt-3);font-size:18px;line-height:1;padding:0 4px}
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:90;background:var(--nav);color:#fff;padding:9px 16px;border-radius:var(--r-sm);font-size:13px;box-shadow:0 8px 22px rgba(14,39,70,.3);max-width:80vw}
.toast.err{background:var(--danger)}
.toast.ok{background:var(--ok)}
.note{background:#f7fafc;border-left:3px solid var(--nav-hi);padding:9px 12px;border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:12px;color:var(--txt-2);margin-bottom:12px}
.note.warn{background:#fffaf0;border-left-color:var(--warn)}
.phone{width:340px;flex:none;border:9px solid var(--nav);border-radius:26px;background:#eaf0f6;overflow:hidden;box-shadow:0 10px 30px rgba(14,39,70,.18)}
.phone .ph{background:var(--nav);color:#fff;padding:12px 14px}
.phone .ph b{font-size:14px;display:block}
.phone .ph span{font-size:11px;color:#9db4cc}
.phone .pb{padding:12px;max-height:530px;overflow:auto}
.pcard{background:#fff;border-radius:var(--r);padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(14,39,70,.07)}
.proc{display:flex;flex-wrap:wrap;gap:6px}
.proc button{padding:5px 10px;border:1px solid var(--line);background:#fff;border-radius:var(--r-sm);font-size:12px;color:var(--txt-2)}
.proc button.on{border-color:var(--primary);background:#e4edf8;color:var(--primary);font-weight:500}
.proc button:disabled{opacity:.45;cursor:not-allowed}
.qbox{position:relative;background:var(--nav);color:#fff;border-radius:var(--r);padding:9px 13px;margin-bottom:9px;font-size:13px}
.qbox .who-b{font-size:11px;color:#9db4cc;margin-bottom:2px}
.chat{max-height:440px;overflow:auto;padding:4px}
.preset{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.preset button{padding:5px 11px;border:1px solid var(--line);background:#fff;border-radius:20px;font-size:12px;color:var(--primary)}
.preset button:hover{background:#f2f7fc}
.login{flex:1;display:grid;place-items:center;background:radial-gradient(1000px 500px at 50% -10%,#1b4b85 0%,var(--nav) 60%)}
.lcard{background:#fff;border-radius:12px;padding:26px 28px;width:360px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.lcard h2{font-size:17px;margin-bottom:3px}
.lcard p{font-size:12px;color:var(--txt-3);margin-bottom:18px}
.role{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;margin-bottom:9px}
.role.on{border-color:var(--primary);background:#f4f8fd}
.role b{font-size:13px;display:block}
.role span{font-size:11px;color:var(--txt-3)}
.sec{margin-top:16px}
.sec>h3{font-size:13px;margin-bottom:8px;color:var(--txt-2);font-weight:600}
@media(max-width:1100px){.g6{grid-template-columns:repeat(3,1fr)}.g21,.g2,.g3{grid-template-columns:1fr}}
@media(max-width:768px){
.app{flex-direction:column}
.side{width:100%;height:auto;position:static;flex-direction:row;align-items:center;overflow-x:auto}
.brand{border-bottom:none;border-right:1px solid rgba(255,255,255,.08);white-space:nowrap;padding:12px}
.nav{display:flex;padding:6px 8px;flex:1}
.nav button{margin-bottom:0;white-space:nowrap;padding:8px}
.side .ft{display:none}
.top{height:auto;min-height:48px;padding:8px 12px;flex-wrap:wrap}
.top h1{font-size:14px}
.body{padding:12px}
.g6{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr}
.phone{width:100%;border-width:6px}
.phone .pb{max-height:none}
}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast-host"></div>
<div id="modal-host"></div>
<script src="app.js"></script>
</body>
</html>
